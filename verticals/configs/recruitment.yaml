# Recruitment agency vertical — India focus.
#
# A vertical is just config: which sources to pull, which signal types matter,
# how to weight them, and the lead threshold. Add a new buyer vertical by
# dropping a sibling YAML file here — no code changes required.

name: recruitment
display_name: "Recruitment Agencies"
description: >
  Companies actively hiring engineers and/or recently funded (so they are about
  to hire). The strongest leads are both funded AND hiring.

# Scrapers (registry keys) this vertical pulls from.
sources:
  - linkedin_jobs
  - naukri
  - indeed
  - wellfound
  - rss_feeds
  - facebook_ads
  - reddit
  - twitter

# Roles to enrich a decision-maker contact for (Apollo, when available).
target_roles:
  - CTO
  - VP Engineering
  - Head of Engineering
  - Founder
  - Co-Founder
  - Head of Talent
  - HR Director

# Keywords that characterize relevant hiring/funding intent.
signal_keywords:
  - software engineer
  - backend engineer
  - full stack
  - frontend
  - data engineer
  - ML engineer
  - devops
  - platform engineer
  - engineering manager
  - raised
  - series a
  - seed round

# Scoring weights. Any key here is credited by the scorer when it applies; the
# total is capped at 100. New signal types can be rewarded via `signal_<type>`.
scoring:
  # Combined hiring + funding is still the gold standard, but funding and
  # high-volume hiring can now qualify on their own: a freshly funded company is
  # about to hire, and a company hiring 5+ engineers is buying recruiting now.
  both_hiring_and_funded: 35
  funding_recency_0_30_days: 50
  funding_recency_31_60: 35
  funding_recency_61_90: 20
  hiring_recency_0_10_days: 25
  hiring_recency_11_20_days: 15
  hiring_role_count_5_plus: 30
  hiring_role_count_2_4: 18
  signal_hiring_ad: 12
  # Explicit buying intent is the hottest signal there is.
  signal_outsource_intent: 40
  signal_agency_switch: 40
  signal_growth_pain: 25
  signal_from_reddit: 8
  signal_from_twitter: 6
  signal_from_wellfound: 10
  contact_email_found: 10
  multi_platform_signal: 12

min_score: 60

# Drop hiring-only leads whose most recent post is older than this many days
# (funding leads use the wider FUNDING_LOOKBACK_DAYS window).
freshness_days: 30

# Optional company filters applied before scoring (empty = no filtering).
filters: {}
